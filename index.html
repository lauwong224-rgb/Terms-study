  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --bg-success: #eaf3de;
    --bg-danger: #fcebeb;
    --bg-warning: #faeeda;
    --bg-info: #e6f1fb;
    --text: #1a1a1a;
    --text2: #555550;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --border3: rgba(0,0,0,0.35);
    --border-success: #3b6d11;
    --border-danger: #a32d2d;
    --border-info: #185fa5;
    --text-success: #3b6d11;
    --text-danger: #a32d2d;
    --text-warning: #854f0b;
    --text-info: #185fa5;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #2a2a27;
      --bg3: #323230;
      --bg-success: #173404;
      --bg-danger: #501313;
      --bg-warning: #412402;
      --bg-info: #042c53;
      --text: #f0efe9;
      --text2: #b4b2a9;
      --text3: #888780;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --border3: rgba(255,255,255,0.3);
      --border-success: #97c459;
      --border-danger: #f09595;
      --border-info: #85b7eb;
      --text-success: #97c459;
      --text-danger: #f09595;
      --text-warning: #ef9f27;
      --text-info: #85b7eb;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .page { max-width: 700px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text3); margin-bottom: 1.5rem; }
  .tab-bar { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .tab { padding: 8px 20px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: transparent; cursor: pointer; font-size: 14px; color: var(--text2); transition: all 0.15s; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border3); font-weight: 500; }
  .tab:hover:not(.active) { background: var(--bg2); }

  /* LEARN MODE */
  .progress-bar-wrap { margin-bottom: 1.25rem; }
  .progress-track { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 6px; border-radius: 3px; background: var(--text-success); transition: width 0.4s; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); }
  .status-chips { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .chip { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .chip-mastered { background: var(--bg-success); color: var(--text-success); }
  .chip-learning { background: var(--bg-warning); color: var(--text-warning); }
  .chip-unseen { background: var(--bg2); color: var(--text2); }
  .round-label { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 1rem; }
  .q-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; }
  .q-type-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 1rem; }
  .q-stem { font-size: 15px; color: var(--text2); margin-bottom: 8px; }
  .q-term-big { font-size: 28px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .q-lang { font-size: 13px; color: var(--text3); margin-bottom: 1.5rem; }
  .mc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mc-opt { padding: 14px 16px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; font-size: 14px; color: var(--text); background: var(--bg); text-align: left; transition: border-color 0.15s, background 0.15s; line-height: 1.4; }
  .mc-opt:hover:not(:disabled) { background: var(--bg2); }
  .mc-opt.correct { border-color: var(--border-success); background: var(--bg-success); color: var(--text-success); }
  .mc-opt.wrong { border-color: var(--border-danger); background: var(--bg-danger); color: var(--text-danger); }
  .type-input { width: 100%; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 12px 14px; font-size: 16px; color: var(--text); background: var(--bg); margin-bottom: 10px; font-family: inherit; }
  .type-input:focus { outline: none; border-color: var(--border3); }
  .type-input.correct { border-color: var(--border-success); background: var(--bg-success); color: var(--text-success); }
  .type-input.wrong { border-color: var(--border-danger); background: var(--bg-danger); color: var(--text-danger); }
  .feedback-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius); margin-top: 8px; font-size: 14px; }
  .feedback-row.correct { background: var(--bg-success); color: var(--text-success); }
  .feedback-row.wrong { background: var(--bg-danger); color: var(--text-danger); }
  .continue-btn { width: 100%; padding: 12px; background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; color: var(--text); margin-top: 1rem; font-family: inherit; transition: background 0.15s; }
  .continue-btn:hover { background: var(--bg2); }
  .submit-btn-sm { padding: 10px 24px; background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text); font-family: inherit; transition: background 0.15s; }

  .complete-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; text-align: center; }
  .complete-title { font-size: 24px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
  .complete-sub { font-size: 15px; color: var(--text2); margin-bottom: 1.5rem; }

  .q-item.graded-wrong { border-color: var(--border-danger); }

  .submit-btn { width: 100%; padding: 12px; background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; color: var(--text); font-family: inherit; transition: background 0.15s; }

  .results-banner { padding: 1.5rem; background: var(--bg2); border-radius: var(--radius-lg); text-align: center; margin-bottom: 1.5rem; }

  .filter-btn.active { background: var(--bg2); color: var(--text); border-color: var(--border3); }
  .stats-row { display: flex; gap: 12px; margin-bottom: 1.5rem; }

  .stat-l { font-size: 12px; color: var(--text2); margin-top: 2px; }
  #learn-view, #test-view { display: none; }
  #learn-view.active, #test-view.active { display: block; }
</style>
</head>

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()}
function isClose(inp,ans){
  const ni=norm(inp),parts=norm(ans).split(/[;,\/]/).map(x=>x.trim());
  for(const p of parts){if(ni===p||(p.length>3&&(ni.includes(p)||p.includes(ni))))return true}
  return false
}

// ── LEARN MODE ──────────────────────────────────────────────
const TOTAL=T.length;
const STREAK_NEEDED=4;
const REVIEW_INTERVAL=15;
let streaks={},hadError={},mastered=new Set(),activePool=[],reviewQueue=[],currentQ=null,answered=false,sessionCount=0,nextReviewAt=REVIEW_INTERVAL;

function initLearn(){
  streaks={};hadError={};mastered=new Set();sessionCount=0;nextReviewAt=REVIEW_INTERVAL;
  T.forEach(t=>{streaks[t[0]]=0;hadError[t[0]]=false});
  activePool=shuffle(T).slice(0,7).map(t=>t[0]);
  reviewQueue=[];
  nextQ();
}

function getNextTerm(){
  if(mastered.size===TOTAL&&reviewQueue.length===0)return null;
  if(sessionCount>=nextReviewAt&&reviewQueue.length>0){
    nextReviewAt=sessionCount+REVIEW_INTERVAL;
    return reviewQueue.shift();
  }
  const remaining=activePool.filter(k=>!mastered.has(k));
  if(remaining.length===0){
    const unseen=T.filter(t=>!mastered.has(t[0])&&!activePool.includes(t[0]));
    if(unseen.length===0)return null;
    const add=shuffle(unseen).slice(0,5);
    add.forEach(t=>activePool.push(t[0]));
    return add[0][0];
  }
  const weights=remaining.map(k=>Math.max(1,STREAK_NEEDED-(streaks[k]||0)));
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<remaining.length;i++){r-=weights[i];if(r<=0)return remaining[i]}
  return remaining[remaining.length-1];
}

function nextQ(){
  if(mastered.size===TOTAL&&reviewQueue.length===0){renderComplete();return}
  const key=getNextTerm();
  if(key===null){renderComplete();return}
  const term=T.find(t=>t[0]===key);
  const isReview=mastered.has(key);
  const useType=sessionCount>10||mastered.size>5;
  currentQ={term,qtype:(useType&&Math.random()>0.4)?'type':'mc',isReview};
  answered=false;renderLearnQ();
}

function renderLearnQ(){
  const {term,qtype}=currentQ;
  const pct=Math.round((mastered.size/TOTAL)*100);
  const streak=streaks[term[0]]||0;
  const unseen=T.filter(t=>!mastered.has(t[0])&&!activePool.includes(t[0])).length;
  const inProgress=activePool.filter(k=>!mastered.has(k)).length;
  let streakDots='';
  for(let i=0;i<STREAK_NEEDED;i++){streakDots+=`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;background:${i<streak?'var(--text-success)':'var(--bg3)'}"></span>`}
  let html=`
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-labels"><span>${mastered.size} / ${TOTAL} mastered</span><span>${inProgress} in progress · ${unseen} unseen</span></div>
    </div>
    <div class="status-chips">
      ${mastered.size>0?`<span class="chip chip-mastered">${mastered.size} mastered</span>`:''}
      ${inProgress>0?`<span class="chip chip-learning">${inProgress} in progress</span>`:''}
      ${unseen>0?`<span class="chip chip-unseen">${unseen} unseen</span>`:''}
    </div>
    <div class="q-card">
      <div class="q-type-label" style="display:flex;justify-content:space-between;align-items:center"><span>${qtype==='mc'?'Multiple choice':'Write the definition'}${currentQ.isReview?' <span style="background:var(--bg-info);color:var(--text-info);font-size:10px;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle">Review</span>':''}</span><span>${streakDots}</span></div>
      <div class="q-stem">What is the definition of</div>
      <div class="q-term-big">${term[0]}</div>
      <div class="q-lang">${term[1]}</div>`;
  if(qtype==='mc'){
    const opts=shuffle([term,...shuffle(T.filter(t=>t[0]!==term[0])).slice(0,3)]);
    html+=`<div class="mc-options">`;
    opts.forEach((o,i)=>{html+=`<button class="mc-opt" id="lopt${i}" onclick="checkMC(${i},'${o[2].replace(/'/g,"\\'")}')">${o[2]}</button>`});
    html+=`</div>`;
  } else {
    html+=`<input class="type-input" id="ltypeinp" placeholder="Type the definition…" autocomplete="off" onkeydown="if(event.key==='Enter')checkType()"><div><button class="submit-btn-sm" onclick="checkType()">Submit</button></div>`;
  }
  html+=`<div id="lfeedback"></div></div>`;
  document.getElementById('learn-root').innerHTML=html;
  if(qtype==='type')setTimeout(()=>{const el=document.getElementById('ltypeinp');if(el)el.focus()},50);
}

function recordAnswer(term,correct){
  sessionCount++;
  if(correct){
    streaks[term[0]]=(streaks[term[0]]||0)+1;
    if(streaks[term[0]]>=STREAK_NEEDED){
      mastered.add(term[0]);
      activePool=activePool.filter(k=>k!==term[0]);
      // if this term was ever wrong, schedule it for a review check later
      if(hadError[term[0]]&&!reviewQueue.includes(term[0])){
        reviewQueue.push(term[0]);
      }
    }
  } else {
    hadError[term[0]]=true;
    streaks[term[0]]=0;
  }
}

function checkMC(idx,chosen){
  if(answered)return;answered=true;
  const {term}=currentQ;const correct=isClose(chosen,term[2]);
  for(let i=0;i<4;i++){const el=document.getElementById('lopt'+i);if(!el)continue;el.disabled=true;if(el.textContent===term[2])el.classList.add('correct');else if(i===idx&&!correct)el.classList.add('wrong')}
  recordAnswer(term,correct);
  showLearnFeedback(correct,term[2]);
}

function checkType(){
  if(answered)return;
  const inp=document.getElementById('ltypeinp');if(!inp||!inp.value.trim())return;
  answered=true;const{term}=currentQ;const correct=isClose(inp.value.trim(),term[2]);
  inp.classList.add(correct?'correct':'wrong');inp.disabled=true;
  recordAnswer(term,correct);
  showLearnFeedback(correct,term[2]);
}

function showLearnFeedback(correct,answer){
  const streak=streaks[currentQ.term[0]]||0;
  const justMastered=mastered.has(currentQ.term[0])&&!currentQ.isReview;
  const isReview=currentQ.isReview;
  const fb=document.getElementById('lfeedback');if(!fb)return;
  let msg;
  if(isReview){
    msg=correct?'Still got it! ✓':'Needs more practice';
    // if failed a review, put it back into active pool to re-learn
    if(!correct){
      mastered.delete(currentQ.term[0]);
      streaks[currentQ.term[0]]=0;
      activePool.push(currentQ.term[0]);
    }
  } else {
    msg=correct?(justMastered?'Mastered! ★':`Correct! (${streak}/${STREAK_NEEDED})`):'Incorrect';
  }
  fb.innerHTML=`<div class="feedback-row ${correct?'correct':'wrong'}" style="margin-top:12px"><span>${msg}</span>${!correct?`<span style="margin-left:4px">Answer: <strong>${answer}</strong></span>`:''}</div><button class="continue-btn" onclick="nextQ()">Continue →</button>`;
}

function renderComplete(){
  document.getElementById('learn-root').innerHTML=`<div class="complete-card"><div class="complete-title">All terms mastered!</div><div class="complete-sub">You got all ${TOTAL} terms correct ${STREAK_NEEDED} times in a row.</div><button class="retake-btn" onclick="restartLearn()">Start over</button></div>`;
}

function restartLearn(){initLearn()}

// ── TEST MODE ────────────────────────────────────────────────
let testTerms=[],testSubmitted=false,testFilter='all',savedVals={};

function initTest(){
  testTerms=shuffle(T).slice(0,70);testSubmitted=false;testFilter='all';savedVals={};renderTest();
}

function renderTest(){
  const N=testTerms.length;let html='';
  if(testSubmitted){
    let correct=0;
    testTerms.forEach((_,i)=>{if(isClose(savedVals[i]||'',testTerms[i][2]))correct++});
    const pct=Math.round((correct/N)*100);
    let grade='',gc='';
    if(pct>=90){grade='Excellent';gc='grade-a'}else if(pct>=75){grade='Good';gc='grade-b'}else if(pct>=60){grade='Needs work';gc='grade-c'}else{grade='Keep studying';gc='grade-d'}
    html+=`<div class="results-banner"><div class="results-score">${correct} / ${N}</div><div class="results-pct">${pct}% correct</div><div class="results-grade ${gc}">${grade}</div><div><button class="retake-btn" onclick="retakeTest()">New test</button></div></div>`;
    html+=`<div class="filter-row"><button class="filter-btn ${testFilter==='all'?'active':''}" onclick="setFilter('all')">All (${N})</button><button class="filter-btn ${testFilter==='wrong'?'active':''}" onclick="setFilter('wrong')">Incorrect</button><button class="filter-btn ${testFilter==='correct'?'active':''}" onclick="setFilter('correct')">Correct</button></div>`;
  } else {
    html+=`<div class="test-meta"><div class="test-title">Mock test — fill in the blank</div><div class="test-sub">Write the English definition for each term · ${N} questions</div></div>`;
  }
  testTerms.forEach((t,i)=>{
    const val=savedVals[i]||'';
    const grade=testSubmitted?(isClose(val,t[2])?'correct':'wrong'):'';
    if(testSubmitted&&testFilter!=='all'&&grade!==testFilter)return;
    html+=`<div class="q-item${testSubmitted?' graded-'+grade:''}"><div class="q-num">Question ${i+1} of ${N}</div><div class="q-term">${t[0]}</div><div class="q-lang">${t[1]}</div><input class="q-input${testSubmitted?' '+grade:''}" id="ti${i}" placeholder="English definition…" autocomplete="off" ${testSubmitted?'disabled':''} value="${val.replace(/"/g,'&quot;')}">`;
    if(testSubmitted&&grade==='wrong')html+=`<div class="q-correct-ans show">Correct answer: ${t[2]}</div>`;
    html+=`</div>`;
  });
  if(!testSubmitted)html+=`<div class="submit-wrap"><button class="submit-btn" onclick="submitTest()">Submit test</button></div>`;
  document.getElementById('test-root').innerHTML=html;
}

function submitTest(){
  testTerms.forEach((_,i)=>{savedVals[i]=document.getElementById('ti'+i)?.value||''});
  testSubmitted=true;renderTest();window.scrollTo(0,0);
}

function setFilter(f){
  testTerms.forEach((_,i)=>{savedVals[i]=document.getElementById('ti'+i)?.value||savedVals[i]||''});
  testFilter=f;renderTest();
}

function retakeTest(){testTerms=shuffle(T).slice(0,70);testSubmitted=false;testFilter='all';savedVals={};renderTest();}

// ── TAB SWITCHING ────────────────────────────────────────────
let testInited=false;
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab==='learn'?0:1].classList.add('active');
  document.getElementById('learn-view').classList.toggle('active',tab==='learn');
  document.getElementById('test-view').classList.toggle('active',tab==='test');
  if(tab==='test'&&!testInited){testInited=true;initTest();}
}

initLearn();
</script>
</body>
</html>
